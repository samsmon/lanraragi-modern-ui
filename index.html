    function closeDrawer() {
      sheet.style.transform = "";
      sheet.style.transition = "";
      sheetBackdrop.style.opacity = "";
      sheetBackdrop.style.transition = "";
      sheet.classList.remove("open", "dragging");
      sheetBackdrop.classList.remove("open", "dragging");
      document.body.classList.remove("modal-open");
    }

    function setupSheetGestures() {
      let touchStartY = 0;
      let touchStartX = 0;
      let currentDeltaY = 0;
      let isDragging = false;
      let canDrag = false;

      sheet.addEventListener("touchstart", (e) => {
        if (!sheet.classList.contains("open") || e.touches.length !== 1) return;
        if (window.innerWidth >= 640) return; // Desktop is side panel

        touchStartY = e.touches[0].clientY;
        touchStartX = e.touches[0].clientX;
        currentDeltaY = 0;
        isDragging = false;

        const isHandle = e.target.closest(".sheet-handle-bar");
        const isAtTop = sheetContent.scrollTop <= 0;
        canDrag = Boolean(isHandle || isAtTop);
      }, { passive: true });

      sheet.addEventListener("touchmove", (e) => {
        if (!canDrag || e.touches.length !== 1) return;
        if (window.innerWidth >= 640) return;

        const touchY = e.touches[0].clientY;
        const touchX = e.touches[0].clientX;
        const deltaY = touchY - touchStartY;
        const deltaX = Math.abs(touchX - touchStartX);

        if (deltaY > 4 && deltaY > deltaX && sheetContent.scrollTop <= 0) {
          if (e.cancelable) e.preventDefault();
          isDragging = true;
          currentDeltaY = deltaY;
          sheet.classList.add("dragging");
          sheetBackdrop.classList.add("dragging");
          sheet.style.transform = `translateY(${deltaY}px)`;
          const opacity = Math.max(0, Math.min(1, 1 - (deltaY / 260)));
          sheetBackdrop.style.opacity = opacity.toString();
        } else if (deltaY <= 0 && isDragging) {
          isDragging = false;
          sheet.classList.remove("dragging");
          sheetBackdrop.classList.remove("dragging");
          sheet.style.transform = "";
          sheetBackdrop.style.opacity = "";
        }
      }, { passive: false });

      const handleTouchEnd = () => {
        if (!isDragging) {
          canDrag = false;
          return;
        }
        isDragging = false;
        canDrag = false;
        sheet.classList.remove("dragging");
        sheetBackdrop.classList.remove("dragging");

        if (currentDeltaY > 80) {
          sheet.style.transition = "transform 0.22s cubic-bezier(0.16, 1, 0.3, 1)";
          sheetBackdrop.style.transition = "opacity 0.22s ease";
          sheet.style.transform = "translateY(100%)";
          sheetBackdrop.style.opacity = "0";
          setTimeout(() => {
            closeDrawer();
          }, 220);
        } else {
          sheet.style.transition = "transform 0.2s cubic-bezier(0.16, 1, 0.3, 1)";
          sheetBackdrop.style.transition = "opacity 0.2s ease";
          sheet.style.transform = "translateY(0)";
          sheetBackdrop.style.opacity = "1";
          setTimeout(() => {
            sheet.style.transform = "";
            sheet.style.transition = "";
            sheetBackdrop.style.opacity = "";
            sheetBackdrop.style.transition = "";
          }, 220);
        }
      };

      sheet.addEventListener("touchend", handleTouchEnd, { passive: true });
      sheet.addEventListener("touchcancel", handleTouchEnd, { passive: true });
    }

    function searchByTag(tag) {
      closeDrawer();
      selectTaxonomyTag(tag);
    }

    // =========================================================================
    // Fullscreen Modern Reader
    // =========================================================================
    async function openReader(arcid, targetPage = 1, title = null) {
      if (typeof targetPage === "string" && isNaN(Number(targetPage))) {
        title = targetPage;
        targetPage = 1;
      }
      targetPage = parseInt(targetPage, 10) || 1;
      currentReaderArcId = arcid;

      if (!title) {
        if (currentArchive && currentArchive.arcid === arcid && currentArchive.title) {
          title = currentArchive.title;
        } else {
          const prog = ReadingHistory.getProgress(arcid);
          if (prog && prog.title) title = prog.title;
        }
      }
      readerTitle.innerText = title || "Manga Reader";

      closeDrawer();
      readerModal.classList.add("active");
      document.body.classList.add("modal-open");
      currentPageIndex = 0;
      isOverlayVisible = true;
      setOverlayVisibility(true);

      // Automatic default: Paged mode
      isWebtoonMode = false;
      if (readerModeBtn) readerModeBtn.innerText = "Paged";
      if (readerSpreadBtn) readerSpreadBtn.style.display = "inline-flex";
      pagedView.style.display = "flex";
      webtoonView.style.display = "none";

      const readerSkeleton = document.getElementById("reader-skeleton");
      if (readerSkeleton) readerSkeleton.style.display = "flex";
      pagedSpreadWrap.style.opacity = "0";

      try {
        const res = await fetch(`/api/archives/${arcid}/files`);
        const data = await res.json();
        currentPages = data.pages || [];

        if (scrubberSlider) scrubberSlider.max = currentPages.length;

        if (readerSkeleton) readerSkeleton.style.display = "none";
        pagedSpreadWrap.style.opacity = "1";

        // Jump to targetPage directly if specified
        let startIdx = 0;
        if (targetPage > 1 && currentPages.length > 0) {
          startIdx = Math.min(targetPage - 1, currentPages.length - 1);
        }
        currentPageIndex = startIdx;
        loadPagedPage(currentPageIndex);
      } catch (err) {
        if (readerSkeleton) readerSkeleton.style.display = "none";
        pagedSpreadWrap.style.opacity = "1";
        alert("Failed to load archive pages: " + err);
        closeReader();
      }
    }

    function closeReader() {
      readerModal.classList.remove("active");
      closeReaderGrid();
      document.body.classList.remove("modal-open");
      pagedImgLeft.src = "";
      pagedImgRight.src = "";
      pagedImgLeft.classList.remove("skeleton-loading");
      pagedImgRight.classList.remove("skeleton-loading");
      const readerSkeleton = document.getElementById("reader-skeleton");
      if (readerSkeleton) readerSkeleton.style.display = "none";
      webtoonView.innerHTML = "";

      // Refresh history view or library card progress indicator
      const activePane = document.querySelector(".view-pane.active");
      if (activePane && activePane.id === "view-history") {
        renderHistoryView();
      } else if (currentReaderArcId) {
        updateCardProgressUI(currentReaderArcId);
      }
    }

    function toggleSpreadMode() {
      isDoublePage = !isDoublePage;
      updateSpreadButton();
      loadPagedPage(currentPageIndex);
    }

    function loadPagedPage(idx) {
      if (idx < 0) idx = 0;
      if (idx >= currentPages.length) idx = currentPages.length - 1;
      currentPageIndex = idx;

      // Update reading history on page turn
      if (currentReaderArcId && currentPages.length > 0) {
        ReadingHistory.saveProgress(currentReaderArcId, idx + 1, currentPages.length);
      }

      if (!isDoublePage) {
        // Single Page Mode
        pagedSpreadWrap.classList.remove("double-mode");
        pagedImgLeft.style.display = "none";
        pagedImgLeft.src = "";
        pagedImgLeft.classList.remove("skeleton-loading");
        pagedImgRight.style.display = "block";
        pagedImgRight.style.opacity = "0.3";
        pagedImgRight.classList.add("skeleton-loading");
        pagedImgRight.src = currentPages[idx];
        pagedImgRight.onload = () => {
          pagedImgRight.classList.remove("skeleton-loading");
          pagedImgRight.style.opacity = "1";
        };
        pagedImgRight.onerror = () => {
          pagedImgRight.classList.remove("skeleton-loading");
        };

        if (scrubberSlider) scrubberSlider.value = idx + 1;
        scrubberCounter.innerText = `${idx + 1} / ${currentPages.length}`;

        // Preload next image
        if (idx + 1 < currentPages.length) {
          const pre = new Image();
          pre.src = currentPages[idx + 1];
        }
      } else {
        // Double Page Spread Mode
        pagedSpreadWrap.classList.add("double-mode");
        const hasSecondPage = (idx + 1 < currentPages.length);

        if (hasSecondPage) {
          pagedImgLeft.style.display = "block";
          pagedImgRight.style.display = "block";
          pagedImgLeft.style.opacity = "0.3";
          pagedImgRight.style.opacity = "0.3";
          pagedImgLeft.classList.add("skeleton-loading");
          pagedImgRight.classList.add("skeleton-loading");

          if (readingDirection === "RTL") {
            // Manga standard: Right side is Page idx, Left side is Page idx + 1
            pagedImgRight.src = currentPages[idx];
            pagedImgLeft.src = currentPages[idx + 1];
          } else {
            // LTR: Left side is Page idx, Right side is Page idx + 1
            pagedImgLeft.src = currentPages[idx];
            pagedImgRight.src = currentPages[idx + 1];
          }

          pagedImgLeft.onload = () => {
            pagedImgLeft.classList.remove("skeleton-loading");
            pagedImgLeft.style.opacity = "1";
          };
          pagedImgLeft.onerror = () => {
            pagedImgLeft.classList.remove("skeleton-loading");
          };
          pagedImgRight.onload = () => {
            pagedImgRight.classList.remove("skeleton-loading");
            pagedImgRight.style.opacity = "1";
          };
          pagedImgRight.onerror = () => {
            pagedImgRight.classList.remove("skeleton-loading");
          };

          if (scrubberSlider) scrubberSlider.value = idx + 1;
          scrubberCounter.innerText = `${idx + 1}-${idx + 2} / ${currentPages.length}`;

          // Preload next spread
          if (idx + 2 < currentPages.length) {
            const pre1 = new Image(); pre1.src = currentPages[idx + 2];
            if (idx + 3 < currentPages.length) {
              const pre2 = new Image(); pre2.src = currentPages[idx + 3];
            }
          }
        } else {
          // Last page standalone
          pagedImgLeft.style.display = "none";
          pagedImgLeft.src = "";
          pagedImgLeft.classList.remove("skeleton-loading");
          pagedImgRight.style.display = "block";
          pagedImgRight.style.opacity = "0.3";
          pagedImgRight.classList.add("skeleton-loading");
          pagedImgRight.src = currentPages[idx];
          pagedImgRight.onload = () => {
            pagedImgRight.classList.remove("skeleton-loading");
            pagedImgRight.style.opacity = "1";
          };
          pagedImgRight.onerror = () => {
            pagedImgRight.classList.remove("skeleton-loading");
          };

          if (scrubberSlider) scrubberSlider.value = idx + 1;
          scrubberCounter.innerText = `${idx + 1} / ${currentPages.length}`;
        }
      }
    }

    function prevPage() {
      if (isWebtoonMode) return;
      const step = isDoublePage ? 2 : 1;
      if (currentPageIndex > 0) {
        loadPagedPage(Math.max(0, currentPageIndex - step));
      }
    }

    function nextPage() {
      if (isWebtoonMode) return;
      const step = isDoublePage ? 2 : 1;
      if (currentPageIndex + step < currentPages.length) {
        loadPagedPage(currentPageIndex + step);
      } else if (isDoublePage && currentPageIndex + 1 < currentPages.length) {
        loadPagedPage(currentPageIndex + 1);
      }
    }

    function jumpToPage(num) {
      if (isWebtoonMode) {
        const targetImg = document.getElementById(`webtoon-page-${num - 1}`);
        if (targetImg) targetImg.scrollIntoView({ behavior: "smooth" });
      } else {
        loadPagedPage(num - 1);
      }
    }

    function toggleReaderOverlay() {
      isOverlayVisible = !isOverlayVisible;
      setOverlayVisibility(isOverlayVisible);
    }

    function setOverlayVisibility(visible) {
      if (readerBottom) readerBottom.classList.toggle("hidden", !visible);
    }

    function toggleReaderMode() {
      isWebtoonMode = !isWebtoonMode;
      if (readerModeBtn) readerModeBtn.innerText = isWebtoonMode ? "Webtoon" : "Paged";
      if (readerSpreadBtn) readerSpreadBtn.style.display = isWebtoonMode ? "none" : "inline-flex";

      if (isWebtoonMode) {
        pagedView.style.display = "none";
        webtoonView.style.display = "flex";
        renderWebtoonView();
      } else {
        webtoonView.style.display = "none";
        pagedView.style.display = "flex";
        loadPagedPage(currentPageIndex);
      }
    }

    function toggleReadingDirection() {
      readingDirection = (readingDirection === "RTL") ? "LTR" : "RTL";
      updateReaderDirButton();
      if (!isWebtoonMode) loadPagedPage(currentPageIndex);
    }

    function handleTouchLeft() {
      if (readingDirection === "RTL") {
        nextPage();
      } else {
        prevPage();
      }
    }

    function handleTouchRight() {
      if (readingDirection === "RTL") {
        prevPage();
      } else {
        nextPage();
      }
    }

    function renderWebtoonView() {
      webtoonView.innerHTML = "";
      currentPages.forEach((url, i) => {
        const img = document.createElement("img");
        img.id = `webtoon-page-${i}`;
        img.src = url;
        img.loading = "lazy";
        img.onclick = toggleReaderOverlay;
        webtoonView.appendChild(img);
      });
    }

    // =========================================================================
    // Reader Thumbnails Grid Sheet ("Library" inside Reader)
    // =========================================================================
    function openReaderGrid() {
      try { history.pushState({ modal: 'readerGrid' }, ''); } catch(e) {}
      gridSheetTotal.innerText = currentPages.length;
      gridSheetBody.innerHTML = "";

      if (gridObserver) gridObserver.disconnect();
      gridObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const img = entry.target;
            if (img.dataset.src) {
              img.src = img.dataset.src;
              img.removeAttribute("data-src");
            }
            gridObserver.unobserve(img);
          }
        });
      }, { root: gridSheetBody, rootMargin: "150px" });

      const fragment = document.createDocumentFragment();
      currentPages.forEach((pageUrl, idx) => {
        const card = document.createElement("div");
        const isActive = (idx === currentPageIndex || (isDoublePage && idx === currentPageIndex + 1));
        card.className = "page-thumb-card" + (isActive ? " active" : "");
        card.innerHTML = `
          <div class="page-thumb-img-wrap skeleton">
            <img data-src="${pageUrl}" alt="${idx + 1}" decoding="async" style="opacity: 0; transition: opacity 0.2s ease;">
          </div>
          <div class="page-num">${idx + 1}</div>
        `;
        const img = card.querySelector("img");
        const wrap = card.querySelector(".page-thumb-img-wrap");
        img.onload = () => {
          if (wrap) wrap.classList.remove("skeleton");
          img.style.opacity = "1";
        };
        img.onerror = () => {
          if (wrap) wrap.classList.remove("skeleton");
        };
        gridObserver.observe(img);

        card.onclick = () => {
          jumpToPage(idx + 1);
          closeReaderGrid();
        };
        fragment.appendChild(card);
      });
      gridSheetBody.appendChild(fragment);

      readerGridSheet.classList.add("open");

      // Smooth scroll to current active thumbnail
      const activeEl = gridSheetBody.querySelector(".page-thumb-card.active");
      if (activeEl) {
        setTimeout(() => activeEl.scrollIntoView({ block: "center", behavior: "smooth" }), 60);
      }
    }

    function closeReaderGrid() {
      readerGridSheet.classList.remove("open");
      if (gridObserver) {
        gridObserver.disconnect();
        gridObserver = null;
      }
    }

    // Touch Swipe Gestures
    function setupSwipeGestures() {
      let touchStartX = 0;
      let touchStartY = 0;
      pagedView.addEventListener("touchstart", (e) => {
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      pagedView.addEventListener("touchend", (e) => {
        if (e.changedTouches.length === 1) {
          const deltaX = e.changedTouches[0].clientX - touchStartX;
          const deltaY = e.changedTouches[0].clientY - touchStartY;
          if (Math.abs(deltaX) > 40 && Math.abs(deltaX) > Math.abs(deltaY) * 1.2) {
            if (readingDirection === "RTL") {
              // Manga flow: Swiping to the right advances to next page, swiping left goes back
              if (deltaX > 0) {
                nextPage();
              } else {
                prevPage();
              }
            } else {
              // Western flow: Swiping left advances to next page, swiping right goes back
              if (deltaX < 0) {
                nextPage();
              } else {
                prevPage();
              }
            }
          }
        }
      }, { passive: true });
    }

    // Keyboard Shortcuts
    function setupKeyboardControls() {
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (readerGridSheet && readerGridSheet.classList.contains("open")) {
            closeReaderGrid();
            return;
          }
          if (readerModal && readerModal.classList.contains("active")) {
            closeReader();
            return;
          }
          if (sheet && sheet.classList.contains("open")) {
            closeDrawer();
            return;
          }
        }
        if (!readerModal || !readerModal.classList.contains("active")) return;
        if (readerGridSheet && readerGridSheet.classList.contains("open")) return;

        if (e.key === "ArrowRight") {
          readingDirection === "RTL" ? prevPage() : nextPage();
        } else if (e.key === "ArrowLeft") {
          readingDirection === "RTL" ? nextPage() : prevPage();
        } else if (e.key === " " || e.key === "PageDown") {
          nextPage();
        } else if (e.key === "PageUp") {
          prevPage();
        }
      });
    }

    // Random Archive Action
    async function triggerRandom() {
      try {
        const randomStart = totalRecords > 0 ? Math.floor(Math.random() * totalRecords) : 0;
        const res = await fetch(`/api/search?start=${randomStart}&length=1`);
        const data = await res.json();
        if (data.data && data.data.length > 0) {
          openDrawer(data.data[0]);
        }
      } catch (e) {
        console.error("Random archive error:", e);
      }
    }

    // =========================================================================
    // History View & Progress UI Helpers
    // =========================================================================
    function renderHistoryView() {
      const container = document.getElementById("history-list");
      const badge = document.getElementById("history-count-badge");
      if (!container) return;

      const items = ReadingHistory.getList();
      if (badge) badge.innerText = `${items.length} ${items.length === 1 ? 'item' : 'items'}`;

      if (items.length === 0) {
        container.innerHTML = `
          <div class="history-empty-state">
            <svg style="width: 48px; height: 48px; color: var(--muted);" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            <div style="font-size: 15px; font-weight: 600; color: var(--foreground);">No reading history yet</div>
            <div style="font-size: 13px; max-width: 320px; line-height: 1.4;">
              Manga you read will automatically be recorded here with your current progress.
            </div>
            <button class="btn btn-secondary" onclick="switchMainView('library')" style="margin-top: 8px;">
              Browse Library
            </button>
          </div>
        `;
        return;
      }

      container.innerHTML = items.map(item => {
        const thumbUrl = `/api/archives/${item.arcid}/thumbnail`;
        const totalP = item.pagecount || 0;
        const curP = item.lastPage || 1;
        const percent = totalP > 0 ? Math.min(100, Math.round((curP / totalP) * 100)) : 0;
        const timeAgo = formatRelativeTime(item.updatedAt);

        return `
          <div class="history-card" data-arcid="${item.arcid}">
            <div class="history-thumb-wrap" onclick="openDrawerFromHistory('${item.arcid}')" title="View details">
              <img class="history-thumb" src="${thumbUrl}" loading="lazy" alt="${escapeHtml(item.title)}">
            </div>
            <div class="history-details">
              <div class="history-title" onclick="openDrawerFromHistory('${item.arcid}')" title="${escapeHtml(item.title)}">
                ${escapeHtml(item.title)}
              </div>
              <div class="history-meta-row">
                <span style="font-weight: 500; color: var(--foreground);">Page ${curP} of ${totalP || '?'} (${percent}%)</span>
                <span>&bull;</span>
                <span>${timeAgo}</span>
              </div>
              <div class="history-progress-track">
                <div class="history-progress-fill" style="width: ${percent}%;"></div>
              </div>
              <div class="history-actions">
                <button class="btn btn-default" style="height: 28px; font-size: 11.5px; padding: 0 12px; gap: 5px;" onclick="openReader('${item.arcid}', ${curP})">
                  <svg style="width: 12px; height: 12px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                  Resume (p. ${curP})
                </button>
                <button class="btn btn-outline" style="height: 28px; font-size: 11.5px; padding: 0 10px; gap: 4px;" onclick="openReader('${item.arcid}', 1)">
                  <svg style="width: 12px; height: 12px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/></svg>
                  From Start
                </button>
                <button class="btn btn-ghost btn-icon" style="height: 28px; width: 28px; margin-left: auto; color: var(--muted);" title="Remove from history" onclick="removeHistoryItem('${item.arcid}')">
                  <svg style="width: 14px; height: 14px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function openDrawerFromHistory(arcid) {
      const prog = ReadingHistory.getProgress(arcid);
      if (!prog) return;
      openDrawer({
        arcid: prog.arcid,
        title: prog.title,
        tags: prog.tags || "",
        pagecount: prog.pagecount || 0
      });
    }

    function removeHistoryItem(arcid) {
      ReadingHistory.removeProgress(arcid);
      renderHistoryView();
      updateCardProgressUI(arcid);
    }

    function clearReadingHistoryPrompt() {
      if (confirm("Are you sure you want to clear your entire reading history?")) {
        ReadingHistory.clearAll();
        renderHistoryView();
        document.querySelectorAll(".card-progress-bar").forEach(b => b.remove());
        document.querySelectorAll(".progress-badge").forEach(b => {
          b.className = "";
        });
      }
    }

    function updateCardProgressUI(arcid) {
      const card = document.querySelector(`.manga-card[data-arcid="${arcid}"]`);
      if (!card) return;
      const prog = ReadingHistory.getProgress(arcid);
      const thumbWrap = card.querySelector(".card-thumb-wrap");
      const cardMeta = card.querySelector(".card-meta");
      if (!thumbWrap || !cardMeta) return;

      const existingBar = thumbWrap.querySelector(".card-progress-bar");

      if (prog && prog.lastPage > 1) {
        const totalP = prog.pagecount || 0;
        const pct = totalP > 0 ? Math.min(100, Math.round((prog.lastPage / totalP) * 100)) : 0;
        if (existingBar) {
          const fill = existingBar.querySelector(".card-progress-fill");
          if (fill) fill.style.width = `${pct}%`;
        } else {
          const bar = document.createElement("div");
          bar.className = "card-progress-bar";
          bar.innerHTML = `<div class="card-progress-fill" style="width: ${pct}%;"></div>`;
          thumbWrap.appendChild(bar);
        }

        const pageSpan = cardMeta.querySelector("span:last-child");
        if (pageSpan) {
          pageSpan.className = "progress-badge";
          pageSpan.innerText = `p. ${prog.lastPage}/${totalP || "?"}`;
        }
      } else {
        if (existingBar) existingBar.remove();
        const pageSpan = cardMeta.querySelector(".progress-badge");
        if (pageSpan) {
          pageSpan.className = "";
          pageSpan.innerText = `${(prog && prog.pagecount) ? prog.pagecount : "?"}p`;
        }
      }
    }

    function formatRelativeTime(ts) {
      if (!ts) return "";
      const now = Date.now();
      const diffSec = Math.floor((now - ts) / 1000);
      if (diffSec < 60) return "Just now";
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin}m ago`;
      const diffHours = Math.floor(diffMin / 60);
      if (diffHours < 24) return `${diffHours}h ago`;
      const diffDays = Math.floor(diffHours / 24);
      if (diffDays === 1) return "Yesterday";
      if (diffDays < 30) return `${diffDays}d ago`;
      return new Date(ts).toLocaleDateString();
    }

    // Helpers
    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function escapeJs(str) {
      if (!str) return "";
      return String(str).replace(/'/g, "\'").replace(/"/g, '\"');
    }
    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return "0 B";
      const k = 1024;
      const sizes = ["B", "KB", "MB", "GB"];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + " " + sizes[i];
    }

    // =========================================================================
    // Auto-hide & Auto-show Floating Footer on Scroll
    // =========================================================================
    let lastScrollY = window.scrollY;
    let scrollTicking = false;
    const appFooter = document.getElementById("app-footer");

    function handleWindowScroll() {
      const currentScrollY = window.scrollY;
      const windowHeight = window.innerHeight;
      const docHeight = document.documentElement.scrollHeight;
      const isAtBottom = (currentScrollY + windowHeight >= docHeight - 40);
      const isAtTop = (currentScrollY <= 20);

      if (isAtTop || isAtBottom) {
        if (appFooter) appFooter.classList.remove("footer-hidden");
      } else if (currentScrollY > lastScrollY + 6 && currentScrollY > 70) {
        if (appFooter) appFooter.classList.add("footer-hidden");
      } else if (currentScrollY < lastScrollY - 6) {
        if (appFooter) appFooter.classList.remove("footer-hidden");
      }
      lastScrollY = currentScrollY;
      scrollTicking = false;
    }

    window.addEventListener("scroll", () => {
      if (!scrollTicking) {
        window.requestAnimationFrame(handleWindowScroll);
        scrollTicking = true;
      }
    }, { passive: true });


    // Browser / Hardware Back Navigation (Closes Pages Overview first, then reader, then drawer)
    window.addEventListener("popstate", (e) => {
      if (readerGridSheet && readerGridSheet.classList.contains("open")) {
        closeReaderGrid();
        return;
      }
      if (readerModal && readerModal.classList.contains("active")) {
        closeReader();
        return;
      }
      if (sheet && sheet.classList.contains("open")) {
        closeDrawer();
        return;
      }
    });

  </script>
</body>
