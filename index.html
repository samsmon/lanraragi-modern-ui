<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z'/%3E%3Cpath d='M6 6h10'/%3E%3Cpath d='M6 10h10'/%3E%3C/svg%3E">
  <title>LANraragi</title>
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/grid.css">
  <link rel="stylesheet" href="css/reader.css">
  <link rel="stylesheet" href="css/search.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/desktop.css">
</head>
<body>
  <!-- Desktop Left Sidebar -->
  <aside class="app-sidebar" id="app-sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon"><svg style="width: 17px; height: 17px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg></div>
        <span>LANraragi</span>
      </div>
      <span class="sidebar-brand-badge">MODERN</span>
    </div>
    <nav class="sidebar-nav">
      <button class="sidebar-nav-item active" id="sidebar-nav-library" onclick="switchMainView('library')"><span class="sidebar-nav-left"><svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg> Library</span></button>
      <button class="sidebar-nav-item" id="sidebar-nav-explore" onclick="switchMainView('explore')"><span class="sidebar-nav-left"><svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg> Browse Tags</span></button>
      <button class="sidebar-nav-item" id="sidebar-nav-history" onclick="switchMainView('history')"><span class="sidebar-nav-left"><svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> History</span><span class="sidebar-badge" id="sidebar-history-count">0</span></button>
      <button class="sidebar-nav-item" id="sidebar-nav-random" onclick="triggerRandom()"><span class="sidebar-nav-left"><svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.5-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg> Random</span></button>
    </nav>
    <div class="sidebar-footer"><a href="http://192.168.18.225:8123" target="_blank" rel="noopener" class="sidebar-ext-link"><span>Native LANraragi</span><svg style="width: 12px; height: 12px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a><div class="sidebar-meta-row"><span>Backend</span><span>:8123</span></div></div>
  </aside>

  <!-- Main Content Area -->
  <main class="main-content">
    <!-- PANE 1: Library View -->
    <div id="view-library" class="view-pane active">
      <div class="status-summary">
        <div style="display: flex; align-items: center; gap: 8px;">
          <strong id="library-count-text">Loading archives...</strong>
          <span id="current-filter-badge" style="display: none;" class="badge" onclick="clearSearch()">
            <span id="current-filter-text"></span> &times;
          </span>
        </div>
      </div>
      <div class="grid-container grid-comfortable" id="manga-grid">
        <!-- Manga Cards dynamically rendered here -->
      </div>
    </div>

    <!-- PANE 2: Explore & Browse by Taxonomy (Artists, Groups, Tags) -->
    <div id="view-explore" class="view-pane">
      <div class="explore-header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2 style="font-size: 16px; font-weight: 600;">Browse by Category</h2>
          <div class="select-wrap">
            <select id="taxonomy-sort-select" class="select" onchange="renderTaxonomy()">
              <option value="count">Most Works</option>
              <option value="name">Name (A-Z)</option>
            </select>
            <svg style="width: 14px; height: 14px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>

        <!-- Taxonomy Namespace Tabs -->
        <div class="taxonomy-tabs">
          <button class="badge active" onclick="switchTaxonomyNamespace('artist', this)">Artists</button><button class="badge" onclick="switchTaxonomyNamespace('group', this)">Groups</button><button class="badge" onclick="switchTaxonomyNamespace('character', this)">Characters</button><button class="badge" onclick="switchTaxonomyNamespace('', this)">Tags</button><button class="badge" onclick="switchTaxonomyNamespace('publisher', this)">Publishers</button><button class="badge" onclick="switchTaxonomyNamespace('series', this)">Series</button>
        </div>

        <!-- Filter within taxonomy -->
        <input type="text" id="taxonomy-search-input" class="input" placeholder="Filter in this list..." oninput="filterTaxonomyList(this.value)">
      </div>

      <!-- Taxonomy Tags Grid -->
      <div class="taxonomy-grid" id="taxonomy-grid">
        <div class="spinner"></div>
      </div>
    </div>

    <!-- PANE 3: Reading History View -->
    <div id="view-history" class="view-pane">
      <div class="history-header">
        <div class="history-title-wrap"><h2 style="font-size: 16px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 8px;"><svg style="width: 17px; height: 17px;" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Reading History</h2><span class="badge" id="history-count-badge">0 items</span></div>
        <button class="btn btn-outline" id="btn-clear-history" onclick="clearReadingHistoryPrompt()" style="height: 28px; font-size: 11.5px; padding: 0 10px; display: inline-flex; align-items: center; gap: 5px;"><svg style="width: 13px; height: 13px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg> Clear History</button>
      </div>
      <div class="history-list" id="history-list"></div>
    </div>
  </main>

  <!-- Archive Details Sheet (Drawer) -->
  <div class="sheet-backdrop" id="sheet-backdrop" onclick="closeDrawer()"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle-bar" onclick="closeDrawer()"><div class="sheet-handle"></div></div>
    <div class="sheet-content" id="sheet-content"></div>
  </div>

  <!-- Fullscreen Modern Reader Modal -->
  <div class="reader-modal" id="reader-modal">
    <!-- Reader Canvas -->
    <div class="reader-canvas" id="reader-canvas">
      <div class="reader-skeleton" id="reader-skeleton" style="display: none;">
        <div class="skeleton reader-skeleton-page"></div>
      </div>
      <div class="paged-view" id="paged-view">
        <div class="paged-touch-left" onclick="handleTouchLeft()"></div>
        <div class="paged-touch-mid" onclick="toggleReaderOverlay()"></div>
        <div class="paged-touch-right" onclick="handleTouchRight()"></div>
        <div class="paged-spread-wrap" id="paged-spread-wrap">
          <img class="paged-img" id="paged-img-left" src="" alt="Left page" style="display: none;">
          <img class="paged-img" id="paged-img-right" src="" alt="Right page">
        </div>
      </div>
      <div class="webtoon-view" id="webtoon-view"></div>
    </div>

    <div class="reader-screen-progress" id="reader-screen-progress">
      <div class="reader-progress-bar" id="reader-screen-progress-bar" style="width: 0%;"></div>
      <div class="reader-page-badge" id="scrubber-counter" onclick="openReaderGrid()" title="Pages Overview">1 / 1</div>
    </div>
    <!-- Reader Footer Overlay (All Controls) -->
    <div class="reader-overlay reader-bottom" id="reader-bottom">
      <div class="reader-controls-row">
        <div class="reader-controls-left">
          <button class="btn btn-secondary btn-icon" onclick="closeReader()" title="Back to Library"><svg style="width: 15px; height: 15px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
          <div class="reader-title" id="reader-title" onclick="openCurrentReaderInfo()" title="View manga info" role="button" tabindex="0">Manga Title</div>
        </div>
        <div class="reader-controls-right">
          <button class="btn btn-secondary btn-icon" onclick="openReaderGrid()" title="Pages Overview / Library"><svg style="width: 15px; height: 15px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></button>
          <button class="btn btn-secondary btn-icon" id="reader-spread-btn" onclick="toggleSpreadMode()" title="Single Page"><svg style="width: 15px; height: 15px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/></svg></button>
          <button class="btn btn-secondary btn-icon" id="reader-settings-btn" onclick="toggleReaderSettings()" title="Reader Settings"><svg style="width: 15px; height: 15px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <div class="reader-settings-backdrop" id="reader-settings-backdrop" onclick="toggleReaderSettings()"></div>
      <div class="reader-settings-dialog" id="reader-settings-dialog">
        <div class="sheet-handle-bar" onclick="toggleReaderSettings()"><div class="sheet-handle"></div></div>
        <div class="settings-header">
          <span style="font-weight: 600; font-size: 13px;">Reader Settings</span>
          <button class="btn btn-ghost btn-icon" onclick="toggleReaderSettings()" style="width: 24px; height: 24px;">✕</button>
        </div>
        <div class="settings-body">
          <div class="settings-group">
            <div class="settings-label">Reading Direction</div>
            <div class="tabs-list" style="width: 100%;"><button class="tab-trigger active" id="setting-dir-rtl" onclick="setReadingDirection('RTL')" style="flex: 1;">RTL (Manga)</button><button class="tab-trigger" id="setting-dir-ltr" onclick="setReadingDirection('LTR')" style="flex: 1;">LTR (Western)</button></div>
          </div>
          <div class="settings-group">
            <div class="settings-label">Spread Mode</div>
            <div class="tabs-list" style="width: 100%;"><button class="tab-trigger active" id="setting-spread-single" onclick="setSpreadMode(false)" style="flex: 1;">1 Page</button><button class="tab-trigger" id="setting-spread-double" onclick="setSpreadMode(true)" style="flex: 1;">2 Pages</button></div>
          </div>
          <div class="settings-group">
            <div class="settings-label">View Mode</div>
            <div class="tabs-list" style="width: 100%;"><button class="tab-trigger active" id="setting-mode-paged" onclick="setReaderMode('paged')" style="flex: 1;">Paged</button><button class="tab-trigger" id="setting-mode-webtoon" onclick="setReaderMode('webtoon')" style="flex: 1;">Webtoon</button></div>
          </div>
        </div>
      </div>
    </div>

    
    <!-- Reader Pages Grid Sheet -->
    <div class="reader-grid-backdrop" id="reader-grid-backdrop" onclick="closeReaderGrid()"></div>
    <div class="reader-grid-sheet" id="reader-grid-sheet">
      <div class="grid-sheet-header">
        <button class="btn btn-secondary btn-icon" onclick="closeReaderGrid()" title="Back to Reader"><svg style="width: 15px; height: 15px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
        <div style="font-size: 13.5px; font-weight: 600;">Pages Overview (<span id="grid-sheet-total">0</span>)</div>
        <button class="btn btn-secondary btn-icon" onclick="closeReaderGrid()" title="Close">✕</button>
      </div>
      <div class="grid-sheet-body" id="grid-sheet-body"></div>
    </div>
  </div>

  <!-- App Footer: Search, Language Filter & Navigation at Bottom -->
  <footer class="app-footer" id="app-footer">
    <!-- Floating Pagination Row -->
    <div class="footer-pagination-wrap" id="footer-pagination-wrap">
      <button class="btn btn-secondary btn-icon" id="page-first-btn" onclick="goToPage(1)" title="First Page"><svg style="width: 14px; height: 14px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/></svg></button>
      <button class="btn btn-secondary" id="page-prev-btn" onclick="goToPage(currentPageNum - 1)"><svg style="width: 14px; height: 14px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg> Prev</button>
      <div class="page-indicator">
        <span>Page</span>
        <input type="number" id="page-input" class="page-num-input" min="1" value="1" onkeydown="if(event.key==='Enter') goToPage(parseInt(this.value))" onblur="goToPage(parseInt(this.value))">
        <span>/ <strong id="page-total-text">1</strong></span>
      </div>
      <button class="btn btn-secondary" id="page-next-btn" onclick="goToPage(currentPageNum + 1)">Next <svg style="width: 14px; height: 14px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
      <button class="btn btn-secondary btn-icon" id="page-last-btn" onclick="goToPage(totalPages)" title="Last Page"><svg style="width: 14px; height: 14px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m6 17 5-5-5-5"/><path d="m13 17 5-5-5-5"/></svg></button>
    </div>

    <div class="footer-search-wrap">
      <div class="footer-search-row">
        <div class="search-box" style="position: relative;">
          <div class="search-suggestions-box" id="search-suggestions"></div>
          <div class="search-icon"><svg style="width: 15px; height: 15px;" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></div>
          <input type="text" id="search-input" class="input" placeholder="Search title, artist:..., -tag..." oninput="handleSearchInput(this.value)" onkeydown="handleSearchKeyDown(event)" autocomplete="off">
          <button class="clear-btn" id="clear-search-btn" onclick="clearSearch()" title="Clear search">✕</button>
        </div>
      </div>

      <!-- Language Filter Chips, Sort By & Density Toggle -->
      <div class="filter-row">
        <span class="badge active" id="filter-chip-all" onclick="applyLanguageFilter('', this)">All Languages</span><span class="badge" id="filter-chip-en" onclick="applyLanguageFilter('language:en', this)">English</span><span class="badge" id="filter-chip-ja" onclick="applyLanguageFilter('language:ja', this)">Japanese</span>
        <div style="display: flex; align-items: center; gap: 6px; margin-left: auto; flex-shrink: 0;">
          <div class="select-wrap select-wrap-compact">
            <select id="sort-select" class="select select-compact" onchange="changeSort(this.value)">
              <option value="date_added:desc">Newest Added</option>
              <option value="date_added:asc">Oldest Added</option>
              <option value="title:asc">Title (A-Z)</option>
              <option value="title:desc">Title (Z-A)</option>
              <option value="pagecount:desc">Pages (High to Low)</option>
            </select>
            <svg style="width: 11px; height: 11px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
          </div>
          <button class="btn btn-secondary btn-icon" id="btn-view-toggle" title="Toggle Grid Density" onclick="toggleDensity()" style="height: 28px; width: 28px;">
            <svg style="width: 14px; height: 14px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="bottom-nav-inner">
      <button class="nav-tab active" id="nav-tab-library" onclick="switchMainView('library')"><svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg> Library</button>
      <button class="nav-tab" id="nav-tab-explore" onclick="switchMainView('explore')"><svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg> Browse Tags</button>
      <button class="nav-tab" id="nav-tab-history" onclick="switchMainView('history')"><svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> History</button>
      <button class="nav-tab" onclick="triggerRandom()"><svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.5-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg> Random</button>
    </nav>
  </footer>

  <!-- Core Modular Scripts -->
  <script src="js/api.js"></script>
  <script src="js/history.js"></script>
  <script src="js/search.js"></script>
  <script src="js/reader.js"></script>
  <script src="js/app.js"></script>
  <script src="js/desktop.js"></script>
</body>
</html>
